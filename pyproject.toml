[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "piiredact"
version = "1.0.0"
description = "Detect and pseudonymise personally identifiable information in documents"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }

dependencies = [
    "python-docx>=1.1",
    "pymupdf>=1.24",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# The statistical recall layer. Everything works without it (rules only).
ner = ["spacy>=3.7,<4"]
# HTTP service.
service = ["fastapi>=0.110", "uvicorn[standard]>=0.29", "python-multipart>=0.0.9"]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.5"]

[project.scripts]
piiredact = "piiredact.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
# E501: line length is enforced by the formatter, not the linter.
# B008: `= File(...)` / `= Depends(...)` in a signature is the FastAPI idiom.
ignore = ["E501", "B008"]
